name: ci

# The three deterministic gates that must stay green on main.
# All Python suites are stdlib `unittest` — no pip install, fully hermetic.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Tool-name drift gate: every mcp__server__tool reference in the agent/
  # command prompts must be a tool name registered in scripts/contract/agent-mcp.schema.json.
  tool-name-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tool-name drift gate
        run: bash scripts/contract/lint-tool-names.sh

  # Python harness + plugin-script tests (stdlib unittest, no external deps).
  # Discovers plugins/*/scripts/tests automatically — a new plugin's tests run
  # without touching this file, and (unlike the old two-file allowlist) every
  # test in the directory runs, not just the ones someone remembered to list.
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bench harness tests
        run: python -m unittest discover -s bench/tests -t .
      - name: plugin script tests
        run: |
          set -e
          for d in plugins/*/scripts/tests; do
            [ -d "$d" ] || continue
            echo "=== $d ==="
            python -m unittest discover -s "$d"
          done

  # Go packages under packages/ (jira-gateway-mcp today, more may join later —
  # each must be a go.work member). Discovered by go.mod, not hardcoded by name.
  go-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: packages/*/go.sum
      - name: build + test each package
        run: |
          set -e
          for gomod in packages/*/go.mod; do
            dir="$(dirname "$gomod")"
            echo "=== $dir ==="
            (cd "$dir" && go build ./... && go test ./...)
          done
